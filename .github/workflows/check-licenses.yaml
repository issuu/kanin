name: Check Licenses
on: [pull_request]
jobs:
  check-licenses:
    runs-on: [ubuntu-24.04]
    permissions:
      pull-requests: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@cbb722410c2e876e24abbe8de2cc27693e501dcb # v4
      - uses: issuu/github-actions/prepare-rust@b37f0dc6e200f808d1c2d00b290b8c8d35362910
      - uses: BendingSpoons/github-actions/check-licenses@93ecd0d0219f774751462bc3151f7182b21ac329 # check-licenses-v0.5.4
        with:
          license-config-github-token: ${{ secrets.LICENSE_CONFIG_GITHUB_TOKEN }}
          scope: external
